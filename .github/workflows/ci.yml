name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
          enable-cache: true
      - run: uv python install 3.12.13
      - run: uv sync --locked --extra dev --python 3.12.13
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pytest
