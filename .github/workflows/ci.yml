name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: tm_test
          POSTGRES_USER: tm_test
          POSTGRES_PASSWORD: test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tm_test -d tm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TM_TEST_DATABASE_URL: postgresql://tm_test:test_only@127.0.0.1:5432/tm_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
          enable-cache: true
      - run: uv python install 3.12.13
      - run: uv sync --locked --extra dev --python 3.12.13
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pytest
